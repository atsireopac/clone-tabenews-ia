<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Caio e Mirela" />
    <title>Caio e Mirela</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #ffffff;
        color: #111111;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 8rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.04em;
        text-align: center;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CAIO E MIRELA</h1>
    </main>
  </body>
</html>
